name: CI/CD - Local Registry + Minikube on EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: flask-k8s
  REGISTRY: localhost:5001

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      # ✅ Copy the entire folder (not just contents)
      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "task-4"       # 👈 copy the folder itself
          target: "~"            # 👈 will result in ~/task-4 on EC2

      - name: Build and Deploy to Minikube
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_ENV,IMAGE_NAME,REGISTRY
          script: |
            set -e
            cd ~/task-4

            echo "=== Checking project structure ==="
            pwd
            ls -la
            echo "=== Checking k8s directory ==="
            ls -la k8s

            echo "=== Building Docker image ==="
            docker build -t $REGISTRY/$IMAGE_NAME:latest .


            echo "=== Pushing image to local registry ==="
            docker push $REGISTRY/$IMAGE_NAME:latest

            eval $(minikube docker-env)
            minikube image load $REGISTRY/$IMAGE_NAME:latest

            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml

            echo "=== Waiting for rollout ==="
            kubectl rollout status deployment/flask-app

            echo "=== Deployment complete ==="
